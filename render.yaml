# Render blueprint — Labor Hours dashboard + button ingest.
#
# Deploys a managed Postgres + the FastAPI web service. Boot applies schema +
# views + seeds (the demo snap_* overlay is skipped — see scripts/apply_all_sql.py);
# load real tickets with one pg_dump restore into the Render DB (see docs) or by
# setting NOTION_TOKEN. The button webhook (POST /notion/button/<token>) works right
# away; the 2-min live Notion sync needs the optional worker + NOTION_TOKEN (bottom).
#
# DEPLOY (from your own Render account):
#   1. This repo is already on GitHub (JustinTjitra/labor-hours).
#   2. Render Dashboard -> New -> Blueprint -> pick the repo -> Apply.
#   3. When prompted, set the "sync:false" secrets below:
#        DASHBOARD_PASSWORD   - login for the private dashboard
#        BUTTON_WEBHOOK_TOKEN - the token in your Notion button's webhook URL
#        NOTION_TOKEN         - leave blank for now; add later to turn on sync
#   4. Your dashboard: https://labor-hours-api.onrender.com  (HTTP Basic: covena / <password>)
#      Button webhook:  https://labor-hours-api.onrender.com/notion/button/<BUTTON_WEBHOOK_TOKEN>
#
# NOTE on Render's free tier: the free web service sleeps after ~15 min idle and cold-
# starts (~30s) on the next request — fine for review, but for reliable button presses
# bump the web `plan` to `starter`. Free Postgres expires after 90 days.

databases:
  - name: labor-hours-db
    plan: free

services:
  # --- Web: dashboard + metrics API + button/Slack webhooks + SSE --------------
  - type: web
    name: labor-hours-api
    runtime: python
    plan: free                       # -> starter to stay warm for live button use
    buildCommand: pip install -r requirements.txt
    # preDeployCommand is a PAID feature on Render, so the (idempotent) SQL apply —
    # schema + views + seed, no demo snapshot — runs at boot instead. Adds ~2s to
    # each cold start; harmless to re-run.
    startCommand: python scripts/apply_all_sql.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: labor-hours-db, property: connectionString }
      - key: DASHBOARD_USER
        value: covena
      - key: DASHBOARD_PASSWORD
        sync: false                  # set in Render UI — never committed
      - key: BUTTON_WEBHOOK_TOKEN
        sync: false
      - key: NOTION_TOKEN
        sync: false                  # blank = sync off; add to enable live ingest
      - key: NOTION_WRITE_ENABLED
        value: "false"               # hard-off; nothing is written back to Notion
      - key: NOTION_TICKET_DB_ID
        value: 35281b4e-061b-80ba-8444-c80960da8ccf   # REAL master Client Feedback DB (DATABASE id, not data-source id)
      - key: NOTION_CLIENTS_DB_ID
        value: 35681b4e-061b-80a8-94ed-f52c5941dc0d   # Master Clients DB (DATABASE id)

  # --- Worker: 2-min Notion sync + auto-closers + outbox flush ------------------
  # ENABLED. Render background workers are a PAID feature — this service needs a paid
  # plan (Starter, ~$7/mo). It polls the master DB every 2 min (incremental via
  # last_edited_time) so the dashboard follows Notion edits automatically, and it
  # auto-closes stale/idle intervals. NOTION_TOKEN must be set (same value as the web
  # service). NOTION_WRITE_ENABLED stays false — the worker still never writes to Notion.
  - type: worker
    name: labor-hours-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: labor-hours-db, property: connectionString }
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_WRITE_ENABLED
        value: "false"
      - key: NOTION_TICKET_DB_ID
        value: 35281b4e-061b-80ba-8444-c80960da8ccf   # REAL master Client Feedback DB (DATABASE id, not data-source id)
      - key: NOTION_CLIENTS_DB_ID
        value: 35681b4e-061b-80a8-94ed-f52c5941dc0d   # Master Clients DB (DATABASE id)
